<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语文冲刺站 · 七年级期中</title><style>:root{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;color:#e8edf8;background:#0b1020}*{box-sizing:border-box}body{margin:0}header{padding:24px max(20px,calc((100vw - 1150px)/2));background:linear-gradient(110deg,#19274c,#10243b);border-bottom:1px solid #344565}h1{margin:0 0 8px;font-size:30px}header p{margin:0;color:#b9c9e3}.layout{max-width:1150px;margin:auto;display:grid;grid-template-columns:230px 1fr;gap:24px;padding:24px}nav{display:flex;flex-direction:column;gap:7px;align-self:start;position:sticky;top:20px}button{font:inherit;cursor:pointer;border:1px solid #3b5075;background:#1c2b49;color:#eaf2ff;padding:10px 14px;border-radius:11px;text-align:left}button:hover,button.active{background:#3154a2;border-color:#6794ff}.card{background:#151f36;border:1px solid #2e3f60;border-radius:18px;padding:22px;margin-bottom:17px;box-shadow:0 8px 24px #0002}h2{margin:0 0 14px}h3{margin:22px 0 10px;color:#9fc2ff}p,li{line-height:1.85}.muted{color:#a5b6d0}.tag{display:inline-block;background:#253d68;color:#b6d6ff;border-radius:30px;padding:4px 10px;font-size:12px;margin:0 5px 7px 0}.line{border-bottom:1px solid #2c3c59;padding:10px 0;line-height:1.8}.original{font-weight:650;color:#e9e2a8}.translation{color:#b8d4ee;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.mini{background:#1d2b47;border:1px solid #344968;padding:14px;border-radius:12px}input,textarea,select{background:#0e1729;color:#fff;border:1px solid #4c6082;border-radius:9px;padding:10px;font:inherit;width:100%}textarea{min-height:80px}.q{margin:16px 0;border-top:1px solid #31405e;padding-top:16px}.q button{margin:5px 5px 0 0}.good{color:#77e4b5}.bad{color:#ffb3a9}.hidden{display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.progress{height:9px;border-radius:10px;background:#263550;overflow:hidden}.progress div{height:100%;background:#5ad3a3;transition:width .2s}footer{text-align:center;padding:20px;color:#8d9bb5}@media(max-width:740px){.layout{grid-template-columns:1fr;padding:12px}nav{position:static;flex-direction:row;overflow:auto}nav button{white-space:nowrap}header{padding:22px 16px}}</style></head><body><header><h1>📚 语文冲刺站 <span style="font-size:16px">MIDTERM LAB</span></h1><p>七年级期中 · 古诗 × 文言文 × 现代文 × 西游记 · 复习、翻译、练习一站完成</p></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div><footer>本地保存答题进度 · 无需账号 · 现代文以课堂笔记和原创概括为主，不提供受版权保护的全文</footer><script>
const wolf=[
{title:'一、遇狼',sent:[['一屠晚归，担中肉尽，止有剩骨。','一个屠户傍晚回家，担子里的肉已经卖完，只剩下骨头。'],['途中两狼，缀行甚远。','路上遇到两只狼，紧跟着他走了很远。']],words:'屠：屠户；止：只、仅；缀：连接、紧跟；甚：很'},
{title:'二、惧狼',sent:[['屠惧，投以骨。','屠户害怕，把骨头扔给狼。'],['一狼得骨止，一狼仍从。','一只狼得到骨头就停下，另一只狼仍然跟着。'],['复投之，后狼止而前狼又至。','屠户又扔骨头，后面的狼停下，前面的狼却又追上来了。'],['骨已尽矣，而两狼之并驱如故。','骨头已经扔完，两只狼却仍像原来一样一起追赶。']],words:'惧：害怕；投以骨：以骨投之；复：又；从：跟从；并驱：一起追赶；如故：像原来一样'},
{title:'三、御狼',sent:[['屠大窘，恐前后受其敌。','屠户非常困窘，担心前后受到狼的攻击。'],['顾野有麦场，场主积薪其中，苫蔽成丘。','他看见田野里有麦场，场主在其中堆积柴草，覆盖成小山似的一堆。'],['屠乃奔倚其下，弛担持刀。','屠户于是跑去倚靠柴草堆，卸下担子，拿起刀。'],['狼不敢前，眈眈相向。','两只狼不敢上前，凶狠地盯着屠户。']],words:'窘：处境困迫；敌：攻击；顾：看；薪：柴草；苫蔽：覆盖、遮盖；乃：于是；弛：卸下；眈眈：凶狠注视的样子'},
{title:'四、杀狼',sent:[['少时，一狼径去，其一犬坐于前。','一会儿，一只狼径直离开，另一只像狗一样蹲坐在前面。'],['久之，目似瞑，意暇甚。','过了一会儿，那只狼眼睛似乎闭着，神情十分悠闲。'],['屠暴起，以刀劈狼首，又数刀毙之。','屠户突然起身，用刀砍狼头，又砍几刀杀死它。'],['方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。','正要离开时，转身看柴草堆后，另一只狼正在其中打洞，打算从通道进入攻击他的背后。'],['身已半入，止露尻尾。','狼身已经钻进去一半，只露出屁股和尾巴。'],['屠自后断其股，亦毙之。','屠户从后面砍断狼的大腿，也杀死了它。'],['乃悟前狼假寐，盖以诱敌。','屠户这才明白前面的狼是假装睡觉，原来是用来诱惑敌人的。']],words:'径：径直；去：离开；犬：像狗一样；瞑：闭眼；意（意暇甚）：神情；暇：从容；暴：突然；方：正；洞：打洞；意（意将）：打算；隧：从通道；尻：屁股；股：大腿；寐：睡觉；盖：原来是'},
{title:'五、议狼',sent:[['狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？','狼也很狡猾，但一会儿两只都被杀死了，禽兽的欺骗手段能有多少呢？'],['止增笑耳。','只是增加笑料罢了。']],words:'黠：狡猾；顷刻：一会儿；变诈：巧变诡诈；几何：多少；止：只；耳：罢了'}];
const jie=[['夫君子之行，静以修身，俭以养德。','君子的行为操守，以宁静专一来修养身心，以节俭来培养品德。'],['非淡泊无以明志，非宁静无以致远。','不能内心恬淡、不慕名利，就无法明确志向；不能宁静专一，就无法达到远大目标。'],['夫学须静也，才须学也，非学无以广才，非志无以成学。','学习必须静心专一，才干来自学习；不学习就无法增长才干，没有志向就无法使学习有所成就。'],['淫慢则不能励精，险躁则不能治性。','放纵懈怠就不能振奋精神，轻薄浮躁就不能修养性情。'],['年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！','年纪随时光飞逝，意志随岁月消失，最终像枯枝落叶般衰败，大多不能对社会有所贡献，只能悲哀地守着穷困的居舍，到那时悔恨又怎么来得及！']];
const poems=[
{title:'秋词（其一）',author:'唐·刘禹锡',key:true,lines:['自古逢秋悲寂寥，我言秋日胜春朝。','晴空一鹤排云上，便引诗情到碧霄。'],notes:'反传统悲秋，赞颂秋日；“排”表现冲破阻碍、昂扬向上的气势。'},
{title:'夜雨寄北',author:'唐·李商隐',key:true,lines:['君问归期未有期，巴山夜雨涨秋池。','何当共剪西窗烛，却话巴山夜雨时。'],notes:'眼前巴山夜雨为实写；想象未来团聚、回忆今夜为虚写。表达思念和团聚的期盼。'},
{title:'行军九日思长安故园',author:'唐·岑参',key:true,lines:['强欲登高去，无人送酒来。','遥怜故园菊，应傍战场开。'],notes:'“九日”是重阳节；借故园菊表达思乡及对战乱中故乡的忧虑。'},
{title:'十一月四日风雨大作（其二）',author:'宋·陆游',key:true,lines:['僵卧孤村不自哀，尚思为国戍轮台。','夜阑卧听风吹雨，铁马冰河入梦来。'],notes:'现实风雨与梦中铁马冰河相连，表达年老孤居仍不忘报国。'},
{title:'峨眉山月歌',author:'唐·李白',lines:['峨眉山月半轮秋，影入平羌江水流。','夜发清溪向三峡，思君不见下渝州。']},
{title:'夜上受降城闻笛',author:'唐·李益',lines:['回乐烽前沙似雪，受降城外月如霜。','不知何处吹芦管，一夜征人尽望乡。']},
{title:'望岳',author:'唐·杜甫',lines:['岱宗夫如何？齐鲁青未了。','造化钟神秀，阴阳割昏晓。','荡胸生曾云，决眦入归鸟。','会当凌绝顶，一览众山小。']},
{title:'石壕吏',author:'唐·杜甫',lines:['暮投石壕村，有吏夜捉人。','老翁逾墙走，老妇出门看。','吏呼一何怒！妇啼一何苦！','听妇前致词：三男邺城戍。','一男附书至，二男新战死。','存者且偷生，死者长已矣！','室中更无人，惟有乳下孙。','有孙母未去，出入无完裙。','老妪力虽衰，请从吏夜归。','急应河阳役，犹得备晨炊。','夜久语声绝，如闻泣幽咽。','天明登前途，独与老翁别。']},
{title:'登岳阳楼',author:'唐·杜甫',lines:['昔闻洞庭水，今上岳阳楼。','吴楚东南坼，乾坤日夜浮。','亲朋无一字，老病有孤舟。','戎马关山北，凭轩涕泗流。']}];
const prose=[{title:'端午的鸭蛋',author:'汪曾祺',work:'受戒',sections:['第1段：家乡端午习俗','第2—3段：高邮鸭蛋','第4—6段：端午鸭蛋活动'],words:'可结合课本核对：门楣、苋菜、腌制、籍贯、肃然起敬等词语的读音与含义。',points:['鸭蛋特点：声名远播、双黄、质细油多。','情感：对故乡的自豪与思念，对童年趣事的怀恋。','语言：自然亲切的口语、地方色彩、适当文言表达，富有幽默与文化意味。']},{title:'猫',author:'郑振铎',work:'海燕',sections:['第1—2段：第一只猫，病死','第3—14段：第二只猫，被路人捉走','第15—34段：第三只猫，蒙冤而死'],words:'结合课本核对：怂恿、怅然、蜷伏、惩戒、妄下断语、畏罪潜逃。',points:['前两次养猫为第三次的悲剧作铺垫、形成对比。','作者反思主观臆断和偏见，强调查明事实、同情弱小者。','“自此我很少再养猫”与“自此我永不养猫”体现不同程度的痛苦与自责。']},{title:'我的白鸽',author:'陈忠实',work:'白鹿原',sections:['饲养白鸽与观察其习性','幼鸽成长带来的审美体验','白鸽飞翔引发的生命感悟'],words:'具体生字词以课堂发放的课文词语表为准。',points:['依恋故巢、纯洁本真、易于喂养、初生时外貌不美、爱护后代。','幼鸽本真之美使作者喜爱、赞美，也产生敬畏之感。','“世界对我来说就是白鸽”：表达对飞翔景象的陶醉、成长的感动与自豪。']},{title:'小圣施威降大圣',author:'吴承恩',work:'西游记',sections:['麻雀→饿鹰；大鹚老→大海鹤；鱼儿→鱼鹰','水蛇→灰鹤；花鸨→弹弓','土地庙→被识破；变化成二郎神模样→追到灌江口'],words:'留意：鹚、鸨、灌江口等字词；以课堂教材注释为准。',points:['孙悟空化土地庙时把尾巴变成旗杆，二郎神发现庙后立旗杆不合常理。','孙悟空机智灵活、善于变化；二郎神善于应变、神勇善战。','想象丰富奇特，斗法情节紧凑。']}];
const journey=[['大闹天宫','反抗权威、桀骜不驯；关注弼马温、齐天大圣等称号。'],['小圣施威降大圣','二郎神与悟空斗法；旗杆破绽；人物形象对比。'],['三打白骨精','悟空识破妖怪，唐僧误会；分析师徒矛盾及人物性格。'],['三调芭蕉扇','借扇过程与铁扇公主、牛魔王的矛盾；关注因果和人物计策。'],['大战红孩儿','三昧真火、观音收服红孩儿；关注情节发展。'],['真假美猴王','真假悟空与六耳猕猴；关注人物冲突和辨认经过。'],['车迟国斗法','与虎力、鹿力、羊力大仙比试；关注斗法方式。'],['女儿国遇险','唐僧面对考验，坚持取经目标。']];
const quiz=[{q:'“缀行甚远”的“缀”是什么意思？',opts:['断开','紧跟','争斗','等待'],ans:1,why:'缀：连接、紧跟。'},{q:'“屠自后断其股”的“股”指什么？',opts:['屁股','胳膊','大腿','尾巴'],ans:2,why:'古汉语中“股”指大腿。'},{q:'《诫子书》“险躁”的意思是？',opts:['轻薄浮躁','险恶的道路','非常急迫','过度勤奋'],ans:0,why:'险躁：轻薄浮躁。'},{q:'《夜雨寄北》想象未来团聚的诗句是？',opts:['君问归期未有期','巴山夜雨涨秋池','晴空一鹤排云上','何当共剪西窗烛'],ans:3,why:'“何当”引出对未来相聚的想象。'},{q:'《猫》第三只猫的遭遇主要启示是？',opts:['只养漂亮的猫','不要主观臆断，要查明事实','不要出门','所有动物都相同'],ans:1,why:'作者反省自己的偏见与妄下断语。'},{q:'孙悟空变土地庙为何被识破？',opts:['忘了变门','尾巴化作庙后旗杆','说了话','变得太高'],ans:1,why:'庙后立旗杆不合常理。'},{q:'《行军九日思长安故园》“九日”是？',opts:['端午','中秋','重阳','清明'],ans:2,why:'九月初九是重阳节。'},{q:'“会当凌绝顶”下一句是？',opts:['一览众山小','乾坤日夜浮','决眦入归鸟','齐鲁青未了'],ans:0,why:'《望岳》末联。'}];
const tabs=[['home','🏠 总览'],['wolf','🐺 狼 · 逐句翻译'],['jie','✉️ 诫子书'],['poems','🏔️ 九首古诗'],['prose','📖 现代文'],['journey','🐒 西游记'],['quiz','🧠 自测题库'],['mistakes','📌 错题本']];let tab='home',reveal=false,poemMode='read';const saved=JSON.parse(localStorage.getItem('midtermAnswers')||'{}');let answers=saved;const el=document.getElementById('main');function save(){localStorage.setItem('midtermAnswers',JSON.stringify(answers))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(s){return `<section class="card">${s}</section>`}function render(){document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');let out='';if(tab==='home'){out=card('<h2>欢迎来到期中冲刺站 🚀</h2><p>先读知识点，再看逐句翻译，最后用练习题检测。内容按你的课堂笔记整理；后五首古诗只安排上下句默写。</p><div class="grid">'+[['🐺','狼','5段逐句翻译'],['✉️','诫子书','全文逐句翻译'],['🏔️','古诗','4首重点＋5首默写'],['📖','现代文','4篇课文笔记'],['🐒','西游记','8个经典情节'],['🧠','练习','隐藏答案与错题重练']].map(a=>`<div class="mini"><h3>${a[0]} ${a[1]}</h3><p>${a[2]}</p></div>`).join('')+'</div>')+card('<h2>考点分工</h2><p><span class="tag">前4首古诗</span>上下句＋理解性默写＋鉴赏选择＋文学常识</p><p><span class="tag">后5首古诗</span>上下句默写</p><p><span class="tag">《狼》</span>字词＋翻译＋分析</p><p><span class="tag">《诫子书》</span>字词为主</p><p><span class="tag">现代文与西游记</span>结构＋字词＋情节＋主旨</p>')}
if(tab==='wolf'){out=card('<h2>🐺 《狼》· 蒲松龄（清）</h2><p class="muted">选自《聊斋志异》｜遇狼 → 惧狼 → 御狼 → 杀狼 → 议狼</p><p><b>主旨：</b>面对狡诈凶恶的势力，不能一味退让，要敢于斗争、善于斗争。</p><p><b>一词多义：</b>止（只／停止）；意（神情／打算）；敌（攻击／敌人）；前（上前／前面）；之（代词／助词）。</p><button onclick="toggleReveal()">${reveal?'🙈 隐藏翻译':'👀 显示全部翻译'}</button>');out+=wolf.map(x=>card(`<h2>${x.title}</h2><p class="muted"><b>重点字词：</b>${x.words}</p>`+x.sent.map(y=>`<div class="line"><div class="original">${y[0]}</div><div class="translation ${reveal?'':'hidden'}">${y[1]}</div><button style="margin-top:6px" onclick="this.previousElementSibling.classList.toggle('hidden')">显示 / 隐藏本句翻译</button></div>`).join(''))).join('')}
if(tab==='jie'){out=card('<h2>✉️ 《诫子书》· 诸葛亮</h2><p class="muted">重点是字词解释，逐句翻译用于帮助理解。</p><p><b>必记：</b>静：屏除杂念和干扰，宁静专一；淡泊：内心恬淡、不慕名利；明志：明确志向；致远：达到远大目标；广才：增长才干；淫慢：放纵懈怠；励精：振奋精神；险躁：轻薄浮躁；治性：修养性情；驰：疾行，指迅速逝去；去：消失。</p>')+card('<h2>全文逐句翻译</h2>'+jie.map(y=>`<div class="line"><div class="original">${y[0]}</div><div class="translation hidden">${y[1]}</div><button onclick="this.previousElementSibling.classList.toggle('hidden')">显示 / 隐藏翻译</button></div>`).join(''))}
if(tab==='poems'){out=card('<h2>🏔️ 九首古诗</h2><div class="toolbar"><button onclick="setPoemMode('read')" class="${poemMode==='read'?'active':''}">📖 阅读模式</button><button onclick="setPoemMode('practice')" class="${poemMode==='practice'?'active':''}">✍️ 上下句默写</button></div><p class="muted">前四首：全题型复习；后五首：上下句默写。</p>');if(poemMode==='read')out+=poems.map(p=>card(`<h2>${p.title}</h2><span class="tag">${p.author}</span><span class="tag">${p.key?'重点：全题型':'上下句默写'}</span><p style="white-space:pre-line;font-size:18px;line-height:2.2">${p.lines.join('\n')}</p>${p.notes?`<h3>鉴赏与理解性默写要点</h3><p>${p.notes}</p>`:''}`)).join('');else{let k=0;out+=poems.map(p=>{let s=`<h3>${p.title}</h3>`;for(const l of p.lines){const halves=l.split(/[，,]/);if(halves.length<2)continue;const id='p'+k++;s+=`<div class="q"><p class="original">${halves[0]}，________</p><input id="${id}" placeholder="默写下句（输入后自己核对）"><button onclick="checkLine('${id}','${encodeURIComponent(halves[1])}')">核对</button><span id="r${id}"></span></div>`}return card(s)}).join('')}}
if(tab==='prose')out=prose.map(p=>card(`<h2>📖 ${p.title}</h2><span class="tag">${p.author}</span><span class="tag">代表作：《${p.work}》</span><h3>结构 / 情节</h3><ul>${p.sections.map(x=>`<li>${x}</li>`).join('')}</ul><h3>重点字词</h3><p>${p.words}</p><h3>常考问题 / 答题要点</h3><ul>${p.points.map(x=>`<li>${x}</li>`).join('')}</ul>`)).join('');
if(tab==='journey')out=card('<h2>🐒 《西游记》名著重点情节</h2><p>作者：吴承恩（明）。四大名著：《西游记》《水浒传》《红楼梦》《三国演义》。</p><p class="muted">《小圣施威降大圣》为课堂明确材料；其余经典情节标为拓展复习，是否必考请以老师要求为准。</p>')+journey.map((x,i)=>card(`<h2>${i+1}. ${x[0]}</h2><span class="tag">${i===1?'课堂材料':'拓展情节'}</span><p>${x[1]}</p><details><summary>思考题：这一情节体现了哪些人物性格？</summary><p>请结合具体行为作答，避免只写“勇敢”“聪明”等空泛词语。</p></details>`)).join('');
if(tab==='quiz'){const done=quiz.filter((q,i)=>answers[i]!==undefined).length;out=card(`<h2>🧠 知识自测</h2><p class="muted">${done}/${quiz.length} 已作答。点击选项立即反馈；错题自动进入错题本。</p><div class="progress"><div style="width:${done/quiz.length*100}%"></div></div>`)+quiz.map((q,i)=>card(`<h3>${i+1}. ${q.q}</h3>${q.opts.map((o,j)=>`<button onclick="choose(${i},${j})" class="${answers[i]===j?'active':''}">${'ABCD'[j]}. ${o}</button>`).join('')}${answers[i]!==undefined?`<p class="${answers[i]===q.ans?'good':'bad'}">${answers[i]===q.ans?'✓ 正确':'✗ 继续加油'}：${q.why}</p>`:''}`)).join('')+card('<button onclick="resetQuiz()">🔄 重置答题记录</button>')}
if(tab==='mistakes'){let missed=quiz.map((q,i)=>({q,i})).filter(x=>answers[x.i]!==undefined&&answers[x.i]!==x.q.ans);out=card(`<h2>📌 错题本</h2><p>当前错题 ${missed.length} 道，答题记录保存在本浏览器。</p>${missed.length?'<button onclick="go(\'quiz\')">返回题库重练</button>':'<p class="good">暂无错题！先去自测题库挑战吧。</p>'}`)+missed.map(x=>card(`<h3>${x.q.q}</h3><p>正确答案：${x.q.opts[x.q.ans]}</p><p>${x.q.why}</p>`)).join('')}
el.innerHTML=out}function go(t){tab=t;render();scrollTo(0,0)}function toggleReveal(){reveal=!reveal;render()}function setPoemMode(m){poemMode=m;render()}function choose(i,j){answers[i]=j;save();render()}function resetQuiz(){answers={};save();render()}function checkLine(id,encoded){const correct=decodeURIComponent(encoded);const input=document.getElementById(id).value.trim().replace(/[\s。！？，、]/g,'');const expected=correct.replace(/[\s。！？，、]/g,'');document.getElementById('r'+id).innerHTML=input===expected?'<span class="good"> ✓ 正确！</span>':`<span class="bad"> ✗ 参考：${esc(correct)}</span>`}render();</script></body></html>
